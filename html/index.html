<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Consent</title>
  <link rel="stylesheet" href="lxr-ui.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="lxr">
  <div id="card" class="lv-card lxr-hidden">
    <div class="lv-head"><img class="lv-logo" src="img/lxrcore-logo.png" alt=""><span class="lxr-mono lxr-t-ash" data-l="asks"></span><span class="lxr-grow"></span><span class="lxr-mono lxr-t-smoke" id="clock"></span></div>
    <div class="lv-name lxr-cut" id="name"></div>
    <div class="lv-what" id="what"></div>
    <div class="lxr-meter"><div class="lxr-meter-fill" id="meter"></div></div>
    <div class="lv-keys lxr-mono lxr-t-smoke"><span class="lxr-key">Y</span><span data-l="yes"></span><span class="lxr-key">N</span><span data-l="no"></span></div>
  </div>
